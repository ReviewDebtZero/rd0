<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="rd0 logo: review debt, to zero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#0c2a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="zero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- three review-debt bars shrinking toward zero -->
  <rect x="84" y="132" width="196" height="34" rx="17" fill="url(#ink)"/>
  <rect x="84" y="200" width="132" height="34" rx="17" fill="url(#ink)" opacity="0.8"/>
  <rect x="84" y="268" width="68" height="34" rx="17" fill="url(#ink)" opacity="0.6"/>
  <!-- the zero: a closed ring with a check -->
  <circle cx="352" cy="300" r="82" fill="none" stroke="url(#zero)" stroke-width="34"/>
  <path d="M314 302l26 26 50-56" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="64" font-weight="700" fill="#f8fafc">rd<tspan fill="#2dd4bf">0</tspan></text>
</svg>
